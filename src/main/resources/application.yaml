# Configuracion comun a todos los entornos.
# Lo que cambia entre entornos vive en application-{dev,cert,prod}.yaml.
# Perfiles: dev (local), cert (certificacion contra el sandbox de Kira), prod.
spring:
  application:
    name: AuTransactional

  servlet:
    multipart:
      # Documentos de un RFI: Kira admite hasta 30 MB por archivo. La peticion se limita a
      # 100 MB aunque Kira acepte 20 archivos: un portal no deberia subir 600 MB de una vez.
      max-file-size: 30MB
      max-request-size: 100MB

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

# --- Integracion con KiraFin (https://docs.kirafin.ai) ---
# Las credenciales NUNCA llevan valor por defecto: si faltan, el perfil las exige o falla.
kira:
  api-key: ${KIRA_API_KEY:}
  client-id: ${KIRA_CLIENT_ID:}
  password: ${KIRA_PASSWORD:}
  webhook-secret: ${KIRA_WEBHOOK_SECRET:}
  webhook-secret-previous: ${KIRA_WEBHOOK_SECRET_PREVIOUS:}
  # Una sola version, enviada en la cabecera de cada peticion (la documentacion lo recomienda
  # aunque la cuenta este fijada). Solo se admite 2026-06-01.
  api-version: ${KIRA_API_VERSION:2026-06-01}
  # El token vive 3600s y no hay refresh: se renueva con margen.
  token-ttl-seconds: 3600
  token-refresh-margin-seconds: 300
  connect-timeout-ms: 5000
  read-timeout-ms: 30000
  # Banco de las cuentas virtuales. Documentados: jp_morgan y austin_capital_trust (este ultimo
  # aun no soportado). KiraProperties rechaza cualquier otro al arrancar.
  bank: ${KIRA_BANK:jp_morgan}
  # Habilita lo que solo existe en el sandbox, como simular un deposito.
  sandbox: ${KIRA_SANDBOX:true}

# Servicio de identidad externo. Solo el BFF lo consume; ninguna credencial viaja al navegador.
biometry:
  base-url: ${BIOMETRY_BASE_URL:}
  api-key: ${BIOMETRY_API_KEY:}

# --- Configuracion propia del BFF ---
bff:
  # Workers que cubren el hueco de un webhook perdido: Kira entrega una sola vez y sin reintentos.
  # Los intervalos son entre ejecuciones (fixedDelay), en milisegundos.
  reconciliation:
    enabled: ${BFF_RECONCILIATION_ENABLED:true}
    initial-delay-ms: 60000
    payouts-ms: 600000        # pagos en vuelo contra GET /v1/payouts/{id}
    payout-batch: 50
    quotations-ms: 300000     # cotizaciones ACTIVE cuyo TTL de 15 min ya paso (sin llamar a Kira)
    liveness-ms: 3600000      # enlaces de liveness vencidos a los 7 dias (sin llamar a Kira)
    rfis-ms: 900000           # RFIs abiertos de cada empresa registrada
    webhooks-ms: 1800000      # eventos almacenados con processed = false: se vuelven a proyectar
    webhook-batch: 50
    tenants-ms: 1800000       # empresas registradas que aun no pueden operar (GET /v1/users/{id})
    accounts-ms: 3600000      # cuentas abiertas: failed, deactivated y frozen no tienen webhook
    # Trae automaticamente al BFF cualquier empresa/cuenta creada directamente en el Sandbox de
    # Kira (fuera del onboarding del portal). Apagado por defecto: crea tenants y administradores
    # con contrasena generada, solo se debe encender en dev/sandbox (ver application-dev.yaml).
    sandbox-sync-enabled: ${BFF_SANDBOX_SYNC_ENABLED:false}
    sandbox-sync-ms: 300000   # cada 5 minutos: GET /v1/users completo, compara contra tenants locales

  # Limites internos de pagos (fijos en configuracion). Desde el umbral, dos aprobadores distintos.
  # tenant-thresholds: umbral propio por id de empresa, p. ej. juriscop: 25000
  payouts:
    approval:
      dual-approval-threshold: ${BFF_DUAL_APPROVAL_THRESHOLD:10000}
      tenant-thresholds: {}

  # Terminos que la empresa acepta antes de enviar su expediente. Viaja a Kira como
  # tos_accepted_version. Sin version, el portal no pide la aceptacion.
  terms:
    version: ${BFF_TERMS_VERSION:}
    url: ${BFF_TERMS_URL:}

  # Reto biometrico obligatorio antes de dar sesion. Debe quedar en true en cert y prod.
  identity-verification:
    enabled: ${BFF_IDENTITY_VERIFICATION_ENABLED:true}

  security:
    jwt-secret: ${BFF_JWT_SECRET:}
    jwt-issuer: ${BFF_JWT_ISSUER:autransactional-bff}
    token-expiration-ms: ${BFF_JWT_TTL_MS:28800000}
    mfa-encryption-key: ${BFF_MFA_ENCRYPTION_KEY:}
    mfa-enforced: ${BFF_MFA_ENFORCED:false}

  # Correo de soporte/operaciones al que se escala una incidencia de integracion desde el
  # centro de eventos (webhooks que agotaron sus reintentos). Vacio por defecto: el portal no
  # ofrece el boton de escalar hasta que el operador lo configure.
  support:
    email: ${BFF_SUPPORT_EMAIL:}

# El requestId (X-Request-Id) de cada peticion va en cada linea de log.
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        # metrics solo para PLATFORM_OPERATOR (SecurityConfig): kira.api.requests, kira.webhooks.*
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
