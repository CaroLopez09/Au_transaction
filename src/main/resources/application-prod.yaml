# Produccion. No se llama a esta base-url hasta tener credenciales de produccion emitidas por Kira.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

kira:
  base-url: ${KIRA_BASE_URL:https://api.balampay.com}
  sandbox: false

bff:
  dev:
    seed: false
  security:
    # Arquitectura §7: fuera de desarrollo nadie entra sin segundo factor.
    mfa-enforced: ${BFF_MFA_ENFORCED:true}

logging:
  level:
    root: WARN
    com.example.autransactional: INFO

# Sin documentacion interactiva expuesta en produccion.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
