# Desarrollo local. Contra el sandbox de Kira y con datos semilla.
spring:
  # Secretos locales fuera del repositorio: `.env` esta en .gitignore. Es `optional:`,
  # asi que si no existe el arranque no falla y las variables se toman del entorno.
  # Solo el perfil dev lo lee: en cert y prod los secretos vienen del gestor de secretos.
  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/autransactional?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    # La contrasena viene de `.env` (o del entorno). El valor por defecto NO es el de
    # tu MySQL local: sin DB_PASSWORD el arranque falla la conexion.
    password: ${DB_PASSWORD:Dev12345!}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: true

kira:
  base-url: ${KIRA_BASE_URL:https://api.balampay.com/sandbox}

bff:
  # Las empresas se crean SIEMPRE en el sandbox de Kira, nunca desde el portal: este worker las
  # trae solo, cada 5 min, con su cuenta virtual y un administrador ya activo.
  reconciliation:
    sandbox-sync-enabled: ${BFF_SANDBOX_SYNC_ENABLED:true}
  # Biometria no configurada en local (BIOMETRY_BASE_URL vacio): el reto nunca se completaria.
  identity-verification:
    enabled: ${BFF_IDENTITY_VERIFICATION_ENABLED:false}
  security:
    # Solo para desarrollo. En cert y prod se exige BFF_JWT_SECRET del entorno.
    jwt-secret: ${BFF_JWT_SECRET:secreto-de-desarrollo-no-usar-fuera-de-local-32b}
  support:
    email: ${BFF_SUPPORT_EMAIL:soporte-ti@juriscop.test}
  dev:
    # Crea organizaciones y operadores de prueba al arrancar. Idempotente.
    seed: ${BFF_DEV_SEED:true}
    seed-password: ${BFF_DEV_SEED_PASSWORD:Dev12345!}

logging:
  level:
    com.example.autransactional: DEBUG

# Documentacion interactiva en /swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
